# /etc/nginx/ssh.conf
# This file must be included from the top-level (not inside http {})

# upstream can have multiple backends — adjust as needed
upstream ssh_backends {
    # Primary ssh backend (change to your real ssh host:port)
    server 127.0.0.1:22;
    #server 10.0.0.5:22;   # example extra backend for load balancing/failover
}

stream {
    # optional: log files (path may need to exist and be writable by nginx)
    access_log /var/log/nginx/ssh_stream_access.log;
    error_log  /var/log/nginx/ssh_stream_error.log;

    # Listen on external port 2222 and forward to ssh_backends
    server {
        listen 2222;            # public port (change to 22 if you want direct 22)
        proxy_pass ssh_backends;

        # Proxy timeouts — increase if users have slow connections
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_protocol off;    # enable if you want PROXY protocol from LB

        # Optional: limit number of connections per source
        # allow 0.0.0.0/0;
        # deny 192.0.2.0/24;

        # Optional: set a unique proxy_bind if required
        # proxy_bind 0.0.0.0 transparent;
    }
}
