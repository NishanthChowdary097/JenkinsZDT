# /etc/nginx/conf.d/default.conf
# NOTE: This file is included by the base /etc/nginx/nginx.conf inside:
#   http { include /etc/nginx/conf.d/*.conf; }
# Do NOT add "http {}" here. Avoid re-declaring sendfile/mime.types/gzip, etc.

# ----- Allowed CORS origins (extend as needed) -----
map $http_origin $cors_origin {
    default                          "";
    "http://localhost:3000"          "http://localhost:3000";
    "http://vm.local:3000"           "http://vm.local:3000";
}

# ----- WebSocket/SSE upgrade mapping -----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# =========================
# vhost: localhost
# =========================
server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    # -------- API with scoped CORS --------
    location /api/ {
        # CORS
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, x-csrf-token, Authorization" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Expose-Headers "x-csrf-token, Authorization" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header Vary "Origin" always;

        # Preflight
        if ($request_method = OPTIONS) { return 204; }

        # Strip /api/ -> backend sees /
        # rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;

        # WS/SSE
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------- Frontend (React) --------
    location / {
        # Frontend likely running with HTTPS on :3000 (CRA/Next dev with HTTPS=true)
        proxy_pass http://frontend:80;

        # TLS/SNI for self-signed dev certs (nginx doesn't verify by default)
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # WebSocket/HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /fallback { return 503 "Service temporarily unavailable."; }
}

# =========================
# vhost: vm.local
# =========================
server {
    listen 80;
    server_name vm.local;
    client_max_body_size 20M;

    location /api/ {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, x-csrf-token, Authorization" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Expose-Headers "x-csrf-token, Authorization" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) { return 204; }

        # rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /fallback { return 503 "Service temporarily unavailable."; }
}
